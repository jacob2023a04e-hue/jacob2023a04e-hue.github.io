<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Recursos Multimídia — Cap. 4 / Ativ. 4</title>
</head>

<body>

    <header>
        <h1>Recursos Multimídia</h1>
    </header>

    <main>

        <!-- BLOCO 1 - VÍDEO NATIVO -->
        <figure>

            <video controls width="800" height="450" poster="poster-aula.jpg" preload="metadata">

                <source src="video/aula-html.mp4" type="video/mp4">
                <source src="video/aula-html.webm" type="video/webm">

                <track src="legendas/aula-html.vtt"
                    kind="subtitles"
                    srclang="pt"
                    label="Português"
                    default>

                <p>
                    Seu navegador não suporta vídeo.
                    <a href="video/aula-html.mp4">Baixar vídeo</a>
                </p>

            </video>

            <figcaption>
                Aula sobre estrutura básica de HTML5 com legendas em português. Fonte: material didático.
            </figcaption>

        </figure>

        <!-- BLOCO 2 - ÁUDIO -->
        <figure>

            <audio controls preload="metadata">

                <source src="audio/podcast-html.mp3" type="audio/mpeg">
                <source src="audio/podcast-html.ogg" type="audio/ogg">

                <p>
                    Seu navegador não suporta áudio.
                    <a href="audio/podcast-html.mp3">Baixar áudio</a>
                </p>

            </audio>

            <figcaption>
                Episódio: Introdução ao HTML e estrutura da web.
                <a href="transcricao.html">Ler transcrição</a>
            </figcaption>

        </figure>

        <!-- BLOCO 3 - YOUTUBE (iframe correto) -->
        <figure>

            <iframe
                width="800"
                height="450"
                src="https://www.youtube.com/embed/Ejkb_YpuHWs"
                title="React JS Crash Course - freeCodeCamp"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

            <figcaption>
                Vídeo educacional sobre React JS (freeCodeCamp) hospedado no YouTube.
            </figcaption>

        </figure>

        <!-- BLOCO 4 - PICTURE -->
        <figure>

            <picture>

                <source media="(min-width: 768px)" srcset="img/banner-wide.jpg">

                <img src="img/banner-mobile.jpg"
                    alt="Banner ilustrando tecnologias de desenvolvimento web"
                    width="800"
                    height="450">

            </picture>

            <figcaption>
                Imagem responsiva demonstrando tecnologias do desenvolvimento web.
            </figcaption>

        </figure>

    </main>

    <footer>
        <p>Nome: Seu Nome</p>
        <p>Matrícula: 00000000</p>
        <p>Data: 17/05/2026</p>
    </footer>

</body>
</html>
